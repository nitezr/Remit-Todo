name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 15 with its newest Xcode -- see "Select newest Xcode" for why not macOS 14.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # GitHub's default Xcode can trail well behind the one Remit is developed with, and an older
      # Swift compiler crashed outright on this code ("error: fatalError"). Use the newest stable
      # Xcode on the image instead. The macOS 14 minimum is still enforced: Package.swift's
      # platforms setting makes the compiler reject any newer API that lacks an availability check.
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"
          swift --version

      - name: Build
        run: swift build

      # The persistence tests deliberately avoid EventKit, so they run headless on a runner with
      # no Reminders database and no TCC grant.
      - name: Test
        run: swift test

      # Packaging breaking is a release-day problem otherwise: this proves the DMG still builds
      # on every push, without publishing anything.
      - name: Package smoke test
        run: |
          ./release.sh 0.0.0-ci
          test -f dist/Remit-0.0.0-ci.dmg
          hdiutil attach dist/Remit-0.0.0-ci.dmg -nobrowse -readonly -mountpoint /tmp/remit-dmg
          test -d /tmp/remit-dmg/Remit.app
          test -x /tmp/remit-dmg/Remit.app/Contents/MacOS/Remit
          hdiutil detach /tmp/remit-dmg
